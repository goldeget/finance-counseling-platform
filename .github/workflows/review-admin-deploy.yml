name: Deploy review administration
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/review-admin/**'
      - 'supabase/config.toml'
      - '.github/workflows/review-admin-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finance-review-admin-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authorization and review handling
        run: node --test independent/tests/access.test.mjs independent/tests/review-admin-edge.test.mjs independent/tests/review-date.test.mjs
      - name: Require deployment credential
        # Token setup: see independent/TOKEN_SETUP.md. Use a project-scoped Supabase token,
        # not a shared credential. Rotation order: add the new token to secrets, verify a
        # manual workflow run succeeds, then revoke the previous token.
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN; no deployment performed. See independent/TOKEN_SETUP.md.' >&2; exit 1; }
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.113.0
      - name: Deploy only review-admin
        run: supabase functions deploy review-admin --project-ref mkdbexvhdayegvjgpkky --use-api
      - name: Confirm unauthenticated modification is blocked
        run: |
          node --input-type=module -e 'const r=await fetch("https://mkdbexvhdayegvjgpkky.supabase.co/functions/v1/review-admin",{method:"POST",headers:{"content-type":"application/json"},body:"{}"});if(r.status!==403)throw Error(`Unexpected status ${r.status}`);console.log("Unauthenticated modification rejected")'
