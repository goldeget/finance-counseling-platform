name: Encrypted recovery key check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recovery using synthetic data
        env:
          APPLICATION_ENCRYPTION_KEY: ${{ secrets.APPLICATION_ENCRYPTION_KEY }}
        run: node independent/key-recovery-check.mjs
