name: Legacy copy retention fallback
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finance-legacy-retention-fallback
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Purge expired legacy copies and report failure
        env:
          SITE_RETENTION_TOKEN: ${{ secrets.SITE_RETENTION_TOKEN }}
        run: node independent/legacy-retention-cli.mjs
