<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>금융상담 접수 관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172441;font:15px system-ui,sans-serif}
main{max-width:1050px;margin:auto;padding:28px 18px 70px}h1{font-size:clamp(24px,4vw,32px)}nav{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid #d7e0ed;background:white;color:#263b5e;border-radius:10px;padding:11px 15px}
button:focus-visible{outline:3px solid #315cf4;outline-offset:3px}button:disabled{opacity:.5}
.active{background:#315cf4;color:white;border-color:#315cf4}.card{background:#fff;border:1px solid #e1e9f3;border-radius:16px;padding:18px;margin:12px 0;overflow-wrap:anywhere}
.meta{color:#52637b;font-size:13px;line-height:1.7}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:14px}
.field{background:#f3f6fb;border-radius:9px;padding:10px}.field span{display:block;color:#61728a;font-size:12px}.field strong{display:block;margin-top:4px}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:20px}.danger{color:#ac243a}.error{color:#b4263a}.loading{color:#536782}
form{display:grid;gap:12px}label{display:grid;gap:6px;color:#425370;font-weight:700}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd8e8;border-radius:10px;font:inherit}input[type=checkbox]{width:auto}textarea{min-height:100px;resize:vertical}.confirm{display:flex;align-items:center;gap:8px;font-weight:500}
</style></head><body><main><h1>금융상담 운영 관리</h1><p>보호된 관리자 계정으로 접속했습니다.</p>
<nav><button id="applications" class="active">상담 접수</button><button id="reviews">이용 후기</button></nav>
<section id="reviewFormSection" class="card" hidden><h2>후기 등록</h2><form id="reviewForm"><div class="fields"><label>작성자<input name="author" maxlength="20" required></label><label>후기 출처<input name="source" maxlength="50" value="고객 확인 후기" required></label><label>작성일<input name="reviewDate" type="date" required></label><label>별점<select name="rating"><option value="5">5점</option><option value="4">4점</option><option value="3">3점</option><option value="2">2점</option><option value="1">1점</option></select></label></div><label>후기 내용<textarea name="content" minlength="5" maxlength="1000" required></textarea></label><label class="confirm"><input name="confirmed" type="checkbox" required> 실제 고객 후기와 게시 동의를 확인했습니다.</label><button type="submit">후기 등록</button></form><p id="reviewFormStatus" role="status"></p></section>
<p id="status" class="loading" role="status" aria-live="polite">불러오는 중입니다.</p><div id="list"></div>
<div class="pager"><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div>
</main><script>
const byId=id=>document.getElementById(id);let mode='applications',offset=0,total=0;const limit=12;
function textNode(parent,tag,value,cls){const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;parent.append(el);return el}
function itemCard(item){
 const root=document.createElement('article');root.className='card';
 textNode(root,'strong',mode==='reviews'?item.author:item.name);
 textNode(root,'p',mode==='reviews'?item.reviewDate+' · '+item.rating+'점 · '+item.source:'접수번호 '+(item.reference||'기존 접수')+' · '+new Date(item.createdAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}),'meta');
 if(mode==='reviews')textNode(root,'p',item.content);
 else {const grid=document.createElement('div');grid.className='fields';for(const [label,value] of [['연락처',item.phone],['생년월일',item.birth],['직업',item.job],['재직',item.tenure||'해당 없음'],['업종',item.industry||'해당 없음'],['연체',item.overdue],['신용카드',item.card],['희망금액',Number(item.amount).toLocaleString()+'만원'],['희망금리','연 '+item.rate+'%'],['상환기간',item.term+'개월']]){const f=document.createElement('div');f.className='field';textNode(f,'span',label);textNode(f,'strong',String(value||''));grid.append(f)}root.append(grid)}
 const del=textNode(root,'button','삭제','danger');del.type='button';del.addEventListener('click',async()=>{if(!confirm('이 항목을 삭제하시겠습니까?'))return;del.disabled=true;try{const base=mode==='reviews'?'/api/admin/reviews/':'/api/admin/applications/';const r=await fetch(base+encodeURIComponent(item.id),{method:'DELETE'});if(!r.ok)throw Error();await load()}catch{byId('status').textContent='삭제하지 못했습니다.';byId('status').className='error';del.disabled=false}});return root;
}
async function load(){byId('status').className='loading';byId('status').textContent='불러오는 중입니다.';byId('list').replaceChildren();
 try{const url=mode==='reviews'?'/api/reviews?limit='+limit+'&offset='+offset:'/api/admin/applications?offset='+offset;const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();total=d.total;d.items.forEach(x=>byId('list').append(itemCard(x)));byId('status').textContent=total?'총 '+total.toLocaleString()+'건':'등록된 항목이 없습니다.';const step=mode==='reviews'?limit:25;byId('page').textContent=total?(offset+1)+'–'+Math.min(offset+step,total)+' / '+total:'0 / 0';byId('prev').disabled=offset===0;byId('next').disabled=offset+step>=total}catch{byId('status').textContent='목록을 불러오지 못했습니다.';byId('status').className='error'}}
for(const id of ['applications','reviews'])byId(id).addEventListener('click',()=>{mode=id;offset=0;byId('reviewFormSection').hidden=id!=='reviews';for(const tab of ['applications','reviews'])byId(tab).classList.toggle('active',tab===id);load()});
const reviewForm=byId('reviewForm');reviewForm.elements.reviewDate.value=new Date(Date.now()+9*3600000).toISOString().slice(0,10);
reviewForm.addEventListener('submit',async e=>{e.preventDefault();const button=reviewForm.querySelector('button');button.disabled=true;byId('reviewFormStatus').textContent='등록 중입니다.';try{const f=new FormData(reviewForm);const body={author:f.get('author'),source:f.get('source'),reviewDate:f.get('reviewDate'),rating:Number(f.get('rating')),content:f.get('content'),confirmed:f.has('confirmed')};const r=await fetch('/api/admin/reviews',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'등록하지 못했습니다.');reviewForm.elements.author.value='';reviewForm.elements.content.value='';reviewForm.elements.confirmed.checked=false;byId('reviewFormStatus').textContent='후기가 등록되었습니다.';offset=0;await load()}catch(error){byId('reviewFormStatus').textContent=error.message||'등록하지 못했습니다.'}finally{button.disabled=false}});
byId('prev').onclick=()=>{offset=Math.max(0,offset-(mode==='reviews'?limit:25));load()};byId('next').onclick=()=>{offset+=mode==='reviews'?limit:25;load()};load();
</script></body></html>
