*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172441;font-family:'Pretendard Variable','Pretendard',sans-serif;letter-spacing:-.04em;animation:page-in .35s ease-out}@keyframes page-in{from{opacity:0}to{opacity:1}}@keyframes page-out{from{opacity:1}to{opacity:0}}a{color:inherit;text-decoration:none}button,select{font:inherit}.wrap{max-width:1120px;margin:auto;padding:0 24px}.top{height:80px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:100;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .3s}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800}.mark{display:grid;place-items:center;width:36px;height:36px;background:#264dcd;border-radius:11px;flex:none}.mark svg{width:30px;height:30px}.toplink{color:#687c99;font-weight:700;font-size:13px;white-space:nowrap}.hero{padding:60px 0 42px}.eyebrow{color:#5571cc;font-size:11px;letter-spacing:.16em;font-weight:800}.hero h1{font-size:clamp(34px,5vw,52px);line-height:1.25;letter-spacing:-.075em;margin:15px 0}.hero p{color:#8490a4;line-height:1.8;font-size:15px}.summary{background:#132344;color:white;border-radius:20px;padding:27px 30px;display:flex;align-items:center;justify-content:space-between;gap:24px}.summary strong{font-size:30px}.summary span{color:#b0bfd8;font-size:13px}.summary-star{color:#ffd17c;letter-spacing:.08em}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:45px 0 20px}.toolbar h2{font-size:23px;margin:0}.toolbar select{border:1px solid #e1e8f2;border-radius:10px;background:white;padding:10px;color:#52627b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{min-width:0;background:white;border:1px solid #e7edf6;border-radius:18px;padding:24px;box-shadow:0 10px 30px #3049780a;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 14px 36px #30497810}.verified-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#1a9e6e;background:#e6f9f0;padding:3px 8px;border-radius:6px;margin-bottom:10px}.review-skeleton{background:linear-gradient(90deg,#eef2f8 25%,#f5f8fc 50%,#eef2f8 75%);background-size:200% 100%;animation:shimmer 1.5s infinite linear;border-radius:18px;min-height:200px}@keyframes shimmer{0%{background-position:200px 0}100%{background-position:-200px 0}}.grid{transition:opacity .2s}.grid.loading{opacity:.4}.stars{color:#f3a82b;letter-spacing:.08em}.card p{font-size:14px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;min-height:100px;margin:18px 0;color:#33445e}.meta{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #edf1f6;padding-top:14px;color:#97a4b6;font-size:12px}.meta strong{color:#62728a}.source{margin-top:8px;color:#8291a7;font-size:11px;overflow-wrap:anywhere}.empty{grid-column:1/-1;background:#fff;border:1px solid #e5ebf5;border-radius:18px;padding:36px;color:#77869c;line-height:1.8}.pagination{display:flex;justify-content:center;align-items:center;gap:18px;margin:34px 0 72px;color:#8291a6;font-size:13px}.pagination button{background:#fff;border:1px solid #dfe7f1;border-radius:10px;padding:11px 15px;color:#52647e;font-weight:700;cursor:pointer}.pagination button:disabled{opacity:.4;cursor:default}.footer{border-top:1px solid #e7ecf4;background:#fff;padding:28px 0;color:#98a5b6;font-size:12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:800px){.wrap{padding:0 20px}.top{height:68px}.brand{font-size:15px}.mark{width:32px;height:32px}.mark svg{width:26px;height:26px}.hero{padding:40px 0 28px}.hero h1{font-size:35px}.summary{padding:22px;align-items:flex-start;flex-direction:column;gap:12px}.grid{grid-template-columns:1fr}.card p{min-height:0}.toolbar{margin-top:34px}.footer{padding-bottom:40px}}@media(min-width:650px) and (max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-color-scheme:dark){body{background:#0e1521;color:#e8edf5}.top{background:rgba(14,21,33,.82)}.brand{color:#e8edf5}.toplink{color:#8e9ab2}.mark{background:#4d76ff}.hero h1{color:#e8edf5}.hero p{color:#8490a4}.eyebrow{color:#6b8aff}.summary{background:#1a2435;color:#e8edf5}.summary span{color:#8e9ab2}.toolbar h2{color:#e8edf5}.toolbar select{background:#1a2435;border-color:#2a3850;color:#9ba8c0}.card{background:#1a2435;border-color:#2a3850;box-shadow:0 10px 30px rgba(0,0,0,.2)}.card:hover{box-shadow:0 14px 36px rgba(0,0,0,.35)}.card p{color:#b0bfd8}.meta{border-top-color:#2a3850;color:#8e9ab2}.meta strong{color:#9ba8c0}.source{color:#77869c}.empty{background:#1a2435;border-color:#2a3850;color:#8e9ab2}.review-skeleton{background:linear-gradient(90deg,#1e2940 25%,#243150 50%,#1e2940 75%);background-size:200% 100%}.pagination{color:#8e9ab2}.pagination button{background:#1a2435;border-color:#2a3850;color:#9ba8c0}.footer{background:#1a2435;border-top-color:#2a3850;color:#77869c}}

</style></head><body><header class="wrap top"><a class="brand" href="/landing.html"><span class="mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><path d="M10 22.5c0-5.4 4.5-9.8 10-9.8 2 0 3.9.6 5.5 1.6M30 17.5c0 5.4-4.5 9.8-10 9.8-2 0-3.9-.6-5.5-1.6" stroke="white" stroke-width="2.4" stroke-linecap="round"/><circle cx="10" cy="22.5" r="2.3" fill="#A9C7FF"/><circle cx="30" cy="17.5" r="2.3" fill="#A9C7FF"/><circle cx="20" cy="20" r="3.2" fill="white"/></svg></span>금융상담 통합지원센터</a><a class="toplink" href="/landing.html" id="homeLink">홈으로 ↗</a></header><main class="wrap"><section class="hero"><span class="eyebrow">CUSTOMER STORIES</span><h1>이용 후기를<br>한눈에 살펴보세요.</h1><p>등록된 후기를 확인하고, 다양한 경험을 살펴보세요.<br>각 후기의 출처는 카드 하단에 표시됩니다.</p></section><section class="summary" aria-live="polite"><div><span>등록된 이용 후기</span><br><strong id="total">확인 중</strong></div><div><span>등록된 후기의 평균 별점</span><br><strong id="average">—</strong> <span class="summary-star">★</span></div></section><div class="toolbar"><h2>전체 후기</h2><label><span class="sr">별점 필터</span><select id="rating"><option value="0">전체 별점</option><option value="5">5점</option><option value="4.5">4.5점</option><option value="4">4점</option><option value="3">3점</option><option value="2">2점</option><option value="1">1점</option></select></label></div><div id="reviews" class="grid" aria-live="polite"><div class="empty">후기를 불러오고 있습니다.</div></div><div class="pagination"><button type="button" id="prev" disabled>이전</button><span id="page">—</span><button type="button" id="next" disabled>다음</button></div></main><footer class="footer"><div class="wrap">금융상담 통합지원센터 · 후기별 출처를 확인해 주세요.</div></footer><script>
const $=s=>document.querySelector(s);let offset=0,totalFiltered=0;const limit=12;function card(item){const root=document.createElement('article');root.className='card';const badge=document.createElement('span');badge.className='verified-badge';badge.textContent='✓ 확인된 후기';const stars=document.createElement('div');stars.className='stars';stars.textContent='★'.repeat(Math.floor(item.rating))+(item.rating%1?'◐':'')+'☆'.repeat(5-Math.ceil(item.rating))+' '+item.rating+'점';stars.setAttribute('aria-label','별점 '+item.rating+'점');const content=document.createElement('p');content.textContent=item.content;const meta=document.createElement('div');meta.className='meta';const author=document.createElement('strong');author.textContent=item.author;const date=document.createElement('span');date.textContent=item.reviewDate;meta.append(author,date);const source=document.createElement('div');source.className='source';source.textContent='출처: '+item.source;root.append(badge,stars,content,meta,source);return root}async function load(){const box=$('#reviews');box.replaceChildren();box.classList.add('loading');for(let i=0;i<6;i++){const sk=document.createElement('div');sk.className='review-skeleton';box.append(sk)}try{const res=await fetch('/api/reviews?limit='+limit+'&offset='+offset+'&rating='+$('#rating').value,{cache:'no-store'});if(!res.ok)throw Error();const data=await res.json();totalFiltered=data.filteredTotal;$('#total').textContent=data.total.toLocaleString('ko-KR')+'건';$('#average').textContent=data.average===null?'—':data.average.toFixed(1);box.classList.remove('loading');box.replaceChildren();if(!data.items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=data.total===0?'등록된 이용 후기가 아직 없습니다.':'선택하신 별점의 후기가 없습니다.';box.append(empty)}else data.items.forEach(item=>box.append(card(item)));$('#page').textContent=totalFiltered?`${offset+1}–${Math.min(offset+limit,totalFiltered)} / ${totalFiltered}`:'0 / 0';$('#prev').disabled=offset===0;$('#next').disabled=offset+limit>=totalFiltered}catch{box.classList.remove('loading');box.replaceChildren();const error=document.createElement('div');error.className='empty';error.textContent='지금은 후기를 불러올 수 없습니다. 잠시 후 다시 확인해 주세요.';box.append(error);$('#total').textContent='확인 불가';$('#average').textContent='—';$('#prev').disabled=true;$('#next').disabled=true}}$('#rating').addEventListener('change',()=>{offset=0;load()});$('#prev').addEventListener('click',()=>{offset=Math.max(0,offset-limit);load()});$('#next').addEventListener('click',()=>{if(offset+limit<totalFiltered){offset+=limit;load()}});const homeLink=document.getElementById('homeLink');if(homeLink)homeLink.addEventListener('click',e=>{e.preventDefault();document.body.style.animation='page-out .2s ease-out forwards';setTimeout(()=>location.href=homeLink.href,180)});load();
</script></body></html>
